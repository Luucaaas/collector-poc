# CI backend de Collector. Contrat : docs/01-qualite/cicd.md (sections 1 à 3).
# P5-01 : déclencheurs et jobs lint et test. P5-02 : build-scan et acceptance.
# P5-03 : publish. P5-04 : sonar.
name: backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Une seule exécution par workflow et par ref. Sur une branche de tâche, la plus
# récente annule l'ancienne ; sur main, elle attend : annuler un publish en cours
# laisserait une publication partielle (un service publié, l'autre non).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Moindre privilège : lecture seule du dépôt. Les jobs qui ont besoin de plus
# (publish : packages: write) l'élargiront eux-mêmes.
permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  # Trivy : binaire de la release officielle, vérifié par sa somme SHA-256 (voir build-scan).
  # Ni trivy-action ni setup-trivy (compromis en mars 2026, GHSA-69fq-xp46-6x23).
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7

jobs:
  lint:
    name: lint (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Installer les dépendances
        run: uv sync --frozen
      - name: Ruff (analyse)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict, code du service)
        run: uv run mypy --strict src

  test:
    name: test (${{ matrix.service }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog-service
            package: catalog
          - service: notification-service
            package: notification
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Installer les dépendances
        run: uv sync --frozen
      # Les testcontainers (PostgreSQL, RabbitMQ) utilisent le Docker de l'exécuteur.
      - name: pytest (couverture minimale 80 %)
        run: >-
          uv run pytest
          --cov=${{ matrix.package }}
          --cov-fail-under=80
          --cov-report=term
          --junitxml=junit.xml
          --cov-report=xml
      - name: Publier coverage.xml
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: error
      - name: Publier junit.xml
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.service }}
          path: services/${{ matrix.service }}/junit.xml
          if-no-files-found: error

  # Plan Free de SonarCloud : seules la branche principale et les pull requests sont
  # analysées. Sur un push de branche de tâche, le job est sauté (voir build-scan).
  sonar:
    name: sonar (${{ matrix.service }})
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, notification-service]
    steps:
      # Historique complet : SonarCloud en a besoin pour le code nouveau et le blame.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Récupérer coverage.xml
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}
      - name: Rapport reçu
        run: ls -l services/${{ matrix.service }}/coverage.xml
      # Le quality gate bloque : sonar.qualitygate.wait=true dans sonar-project.properties.
      - name: Analyse SonarCloud
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: services/${{ matrix.service }}

  build-scan:
    name: build-scan (${{ matrix.service }})
    needs: sonar
    # Un sonar sauté (push de branche) ne bloque pas la suite ; un sonar en échec la bloque.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, notification-service]
    env:
      IMAGE: collector/${{ matrix.service }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Image amd64 seule, chargée dans le Docker local (rien n'est publié ici).
      - name: Construire l'image
        run: >-
          docker build
          --build-arg GIT_SHA=${{ github.sha }}
          --tag "$IMAGE"
          services/${{ matrix.service }}
      - name: Afficher les labels OCI
        run: docker inspect --format '{{ json .Config.Labels }}' "$IMAGE"
      - name: Installer Trivy (release officielle, somme SHA-256 vérifiée)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Trivy (dépendances, paquets de l'OS, secrets)
        run: >-
          trivy image
          --scanners vuln,secret
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          "$IMAGE"
      - name: Exporter l'image
        run: docker save "$IMAGE" --output "$RUNNER_TEMP/${{ matrix.service }}.tar"
      - name: Publier l'image (artefact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 7

  acceptance:
    needs: build-scan
    # Même condition que build-scan : un ancêtre sauté (sonar sur une branche) ne doit pas
    # sauter ce job, un ancêtre en échec le bloque.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      CATALOG_IMAGE: collector/catalog-service:ci
      NOTIFICATION_IMAGE: collector/notification-service:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tests/acceptance/uv.lock
      - name: Récupérer les images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Charger les images
        run: |
          for archive in "$RUNNER_TEMP"/images/*/*.tar; do docker load --input "$archive"; done
          docker image ls
      - name: Installer les dépendances des tests
        working-directory: tests/acceptance
        run: uv sync --frozen
      - name: Ruff (analyse, tests d'acceptation)
        working-directory: tests/acceptance
        run: uv run ruff check .
      - name: Ruff (format, tests d'acceptation)
        working-directory: tests/acceptance
        run: uv run ruff format --check .
      - name: mypy (strict, tests d'acceptation)
        working-directory: tests/acceptance
        run: uv run mypy --strict .
      - name: Démarrer la pile (docker compose)
        run: deploy/compose/up.sh --no-build
      - name: pytest (17 critères d'acceptation)
        working-directory: tests/acceptance
        run: uv run pytest --junitxml=junit.xml
      - name: Publier junit.xml
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-acceptance
          path: tests/acceptance/junit.xml
          if-no-files-found: error
      - name: Journaux des conteneurs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --timestamps
      - name: Arrêter la pile
        if: always()
        run: deploy/compose/down.sh --volumes

  # Publication : uniquement sur main, après un pipeline entièrement vert (needs).
  # La condition event_name évite qu'une pull request ne publie (secrets et jeton restreints).
  publish:
    name: publish (${{ matrix.service }})
    needs: acceptance
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, notification-service]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/luucaaas/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU émule arm64 sur l'exécuteur amd64 ; Buildx produit un manifeste multi-architecture.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Connexion à GHCR (GITHUB_TOKEN, aucun secret personnel)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags et labels OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main
      - name: Construire et publier (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      # Traçabilité (cicd.md, section 4) : le digest est la seule référence immuable.
      - name: Résumé (image, tags, digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image publiée : ${IMAGE}"
            echo
            echo "- Digest : \`${DIGEST}\`"
            echo "- Commit : \`${GITHUB_SHA}\`"
            echo "- Plateformes : linux/amd64, linux/arm64"
            echo "- Tags :"
            while read -r tag; do echo "  - \`${tag}\`"; done <<< "$TAGS"
            echo
            echo "Référence immuable : \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
