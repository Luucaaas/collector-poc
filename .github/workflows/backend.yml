# Collector backend CI. Contract: docs/01-qualite/cicd.md (sections 1 to 3).
# P5-01: triggers and the lint and test jobs. P5-02: build-scan and acceptance.
# P5-03: publish. P5-04: sonar.
name: backend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# One run per workflow and per ref. On a task branch the newest run cancels the older one;
# on main it queues: cancelling a publish in progress would leave a partial publication
# (one service published, the other not).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: read-only access to the repository. Jobs that need more
# (publish: packages: write) widen it themselves.
permissions:
  contents: read

env:
  UV_PYTHON: "3.12"
  # Trivy: binary from the official release, verified by its SHA-256 checksum (see build-scan).
  # Neither trivy-action nor setup-trivy (compromised in March 2026, GHSA-69fq-xp46-6x23).
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7

jobs:
  lint:
    name: lint (${{ matrix.service }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, notification-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run ruff check .
      - name: Ruff (format)
        run: uv run ruff format --check .
      - name: mypy (strict, service code)
        run: uv run mypy --strict src

  test:
    name: test (${{ matrix.service }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: catalog-service
            package: catalog
          - service: notification-service
            package: notification
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - name: Install dependencies
        run: uv sync --frozen
      # Testcontainers (PostgreSQL, RabbitMQ) use the runner's Docker.
      - name: pytest (minimum coverage 80%)
        run: >-
          uv run pytest
          --cov=${{ matrix.package }}
          --cov-fail-under=80
          --cov-report=term
          --junitxml=junit.xml
          --cov-report=xml
      - name: Upload coverage.xml
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.xml
          if-no-files-found: error
      - name: Upload junit.xml
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-${{ matrix.service }}
          path: services/${{ matrix.service }}/junit.xml
          if-no-files-found: error

  # SonarCloud Free plan: only the main branch and pull requests are
  # analysed. On a task-branch push the job is skipped (see build-scan).
  sonar:
    name: sonar (${{ matrix.service }})
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, notification-service]
    steps:
      # Full history: SonarCloud needs it for new code and blame.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage.xml
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}
      - name: Check coverage.xml
        run: ls -l services/${{ matrix.service }}/coverage.xml
      # The quality gate blocks: sonar.qualitygate.wait=true in sonar-project.properties.
      - name: SonarCloud analysis
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          projectBaseDir: services/${{ matrix.service }}

  build-scan:
    name: build-scan (${{ matrix.service }})
    needs: sonar
    # A skipped sonar (branch push) does not block what follows; a failed sonar does.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, notification-service]
    env:
      IMAGE: collector/${{ matrix.service }}:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # amd64 image only, loaded into the local Docker (nothing is published here).
      - name: Build the image
        run: >-
          docker build
          --build-arg GIT_SHA=${{ github.sha }}
          --tag "$IMAGE"
          services/${{ matrix.service }}
      - name: Show OCI labels
        run: docker inspect --format '{{ json .Config.Labels }}' "$IMAGE"
      - name: Install Trivy (official release, SHA-256 checksum verified)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Trivy (dependencies, OS packages, secrets)
        run: >-
          trivy image
          --scanners vuln,secret
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          "$IMAGE"
      - name: Export the image
        run: docker save "$IMAGE" --output "$RUNNER_TEMP/${{ matrix.service }}.tar"
      - name: Upload the image (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/${{ matrix.service }}.tar
          if-no-files-found: error
          retention-days: 7

  acceptance:
    needs: build-scan
    # Same condition as build-scan: a skipped ancestor (sonar on a branch) must not
    # skip this job; a failed ancestor blocks it.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-24.04
    env:
      CATALOG_IMAGE: collector/catalog-service:ci
      NOTIFICATION_IMAGE: collector/notification-service:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: tests/acceptance/uv.lock
      - name: Download the images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Load the images
        run: |
          for archive in "$RUNNER_TEMP"/images/*/*.tar; do docker load --input "$archive"; done
          docker image ls
      - name: Install the test dependencies
        working-directory: tests/acceptance
        run: uv sync --frozen
      - name: Ruff (lint, acceptance tests)
        working-directory: tests/acceptance
        run: uv run ruff check .
      - name: Ruff (format, acceptance tests)
        working-directory: tests/acceptance
        run: uv run ruff format --check .
      - name: mypy (strict, acceptance tests)
        working-directory: tests/acceptance
        run: uv run mypy --strict .
      - name: Start the stack (docker compose)
        run: deploy/compose/up.sh --no-build
      - name: pytest (17 acceptance criteria)
        working-directory: tests/acceptance
        run: uv run pytest --junitxml=junit.xml
      - name: Upload junit.xml
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-acceptance
          path: tests/acceptance/junit.xml
          if-no-files-found: error
      - name: Container logs
        if: failure()
        working-directory: deploy/compose
        run: docker compose logs --no-color --timestamps
      - name: Stop the stack
        if: always()
        run: deploy/compose/down.sh --volumes

  # Publication: main only, after a fully green pipeline (needs).
  # The event_name condition keeps a pull request from publishing (restricted secrets and token).
  publish:
    name: publish (${{ matrix.service }})
    needs: acceptance
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: [catalog-service, notification-service]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/luucaaas/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU emulates arm64 on the amd64 runner; Buildx produces a multi-architecture manifest.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR (GITHUB_TOKEN, no personal secret)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main
      - name: Build and publish (amd64 + arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      # Traceability (cicd.md, section 4): the digest is the only immutable reference.
      - name: Summary (image, tags, digest)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image: ${IMAGE}"
            echo
            echo "- Digest: \`${DIGEST}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Tags:"
            while read -r tag; do echo "  - \`${tag}\`"; done <<< "$TAGS"
            echo
            echo "Immutable reference: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
