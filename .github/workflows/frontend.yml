# Collector front-end CI. Contract: docs/01-qualite/cicd.md (sections 1 to 3, `frontend` row).
# Same triggers, concurrency, permissions and hardening as backend.yml (see its comments).
name: frontend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# One run per workflow and per ref. On a task branch the newest run cancels the older one;
# on main it queues: cancelling a publish in progress would leave a partial publication.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least privilege: read-only access to the repository. The publish job widens it itself (packages: write).
permissions:
  contents: read

env:
  # Trivy: binary from the official release, verified by its SHA-256 checksum (see the frontend job).
  # Neither trivy-action nor setup-trivy (compromised in March 2026, GHSA-69fq-xp46-6x23).
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      IMAGE: collector/frontend:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: ESLint (no warnings tolerated)
        run: npm run lint
      - name: Vitest
        run: npm test
      # Trivy scans the nginx image, which no longer contains the npm packages (only dist/):
      # only npm audit sees the dependencies bundled into the build. Development dependencies
      # (tooling) are outside the threshold.
      - name: npm audit (bundled dependencies, HIGH and above)
        run: npm audit --omit=dev --audit-level=high
      # amd64 image only, loaded into the local Docker (nothing is published here). The image
      # build runs `npm run build` (tsc then vite build).
      - name: Build the image
        run: >-
          docker build
          --build-arg GIT_SHA=${{ github.sha }}
          --tag "$IMAGE"
          .
      - name: Show OCI labels
        run: docker inspect --format '{{ json .Config.Labels }}' "$IMAGE"
      - name: Install Trivy (official release, SHA-256 checksum verified)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Trivy (OS packages, secrets)
        run: >-
          trivy image
          --scanners vuln,secret
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          "$IMAGE"

  # Publication: main only, after a fully green pipeline (needs).
  # The event_name condition keeps a pull request from publishing (restricted secrets and token).
  publish:
    needs: frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/luucaaas/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU emulates arm64 on the amd64 runner; Buildx produces a multi-architecture manifest.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to GHCR (GITHUB_TOKEN, no personal secret)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags and OCI labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main
      # Publish by digest, scan, then tag: the multi-architecture index is pushed WITHOUT a tag
      # (push-by-digest). No unscanned image therefore receives a tag, and Trivy analyses exactly
      # the published digest, arm64 included. If a scan fails, the untagged digest stays on GHCR
      # (harmless: deploy.sh only deploys by tag, then by digest).
      - name: Build and push by digest (amd64 + arm64, no tag)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Install Trivy (official release, SHA-256 checksum verified)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      # Trivy reads the credentials written by docker/login-action (~/.docker/config.json).
      - name: Trivy on the published digest (amd64)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: >-
          trivy image
          --platform linux/amd64
          --scanners vuln,secret
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          "${IMAGE}@${DIGEST}"
      - name: Trivy on the published digest (arm64)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: >-
          trivy image
          --platform linux/arm64
          --scanners vuln,secret
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          "${IMAGE}@${DIGEST}"
      # Both scans passed: the tags are set on the scanned digest (no rebuild).
      - name: Tag the digest (sha-<7> and main)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          # Guard: each tag must point to exactly the scanned digest (not a new index).
          while read -r tag; do
            [ -n "$tag" ] || continue
            tagged="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [ "$tagged" != "$DIGEST" ]; then
              echo "::error::$tag points to $tagged instead of the scanned digest $DIGEST"
              exit 1
            fi
            echo "$tag -> $tagged (scanned digest)"
          done <<< "$TAGS"
      # Traceability (cicd.md, section 4): the digest is the only immutable reference.
      - name: Summary (image, tags, digest, scans)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Published image: ${IMAGE}"
            echo
            echo "- Digest: \`${DIGEST}\`"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Platforms: linux/amd64, linux/arm64"
            echo "- Trivy (CRITICAL, HIGH fixable, secrets): amd64 passed, arm64 passed (otherwise the tags would not be set)"
            echo "- Tags:"
            while read -r tag; do echo "  - \`${tag}\`"; done <<< "$TAGS"
            echo
            echo "Immutable reference: \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
