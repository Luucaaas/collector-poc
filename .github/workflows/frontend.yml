# CI du front de Collector. Contrat : docs/01-qualite/cicd.md (sections 1 à 3, ligne `frontend`).
# Mêmes déclencheurs, concurrence, permissions et durcissement que backend.yml (voir ses commentaires).
name: frontend

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Une seule exécution par workflow et par ref. Sur une branche de tâche, la plus récente annule
# l'ancienne ; sur main, elle attend : annuler un publish en cours laisserait une publication partielle.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Moindre privilège : lecture seule du dépôt. Le job publish élargit lui-même (packages: write).
permissions:
  contents: read

env:
  # Trivy : binaire de la release officielle, vérifié par sa somme SHA-256 (voir le job frontend).
  # Ni trivy-action ni setup-trivy (compromis en mars 2026, GHSA-69fq-xp46-6x23).
  TRIVY_VERSION: "0.76.0"
  TRIVY_SHA256: e24b1c51293c1b15e4ba8d45bbc7891ba053f90278ec2698f3562c993e145fe7

jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    env:
      IMAGE: collector/frontend:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dépendances
        run: npm ci
      - name: ESLint (aucun avertissement toléré)
        run: npm run lint
      - name: Vitest
        run: npm test
      # Trivy analyse l'image nginx, qui ne contient plus les paquets npm (seulement dist/) :
      # seul npm audit voit les dépendances embarquées dans le bundle. Les dépendances de
      # développement (outillage) sont hors du seuil.
      - name: npm audit (dépendances embarquées, HIGH et plus)
        run: npm audit --omit=dev --audit-level=high
      # Image amd64 seule, chargée dans le Docker local (rien n'est publié ici). Le build de
      # l'image exécute `npm run build` (tsc puis vite build).
      - name: Construire l'image
        run: >-
          docker build
          --build-arg GIT_SHA=${{ github.sha }}
          --tag "$IMAGE"
          .
      - name: Afficher les labels OCI
        run: docker inspect --format '{{ json .Config.Labels }}' "$IMAGE"
      - name: Installer Trivy (release officielle, somme SHA-256 vérifiée)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: Trivy (paquets de l'OS, secrets)
        run: >-
          trivy image
          --scanners vuln,secret
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          "$IMAGE"

  # Publication : uniquement sur main, après un pipeline entièrement vert (needs).
  # La condition event_name évite qu'une pull request ne publie (secrets et jeton restreints).
  publish:
    needs: frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/luucaaas/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # QEMU émule arm64 sur l'exécuteur amd64 ; Buildx produit un manifeste multi-architecture.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Connexion à GHCR (GITHUB_TOKEN, aucun secret personnel)
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags et labels OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main
      # Publier par digest, scanner, puis étiqueter : l'index multi-architecture est poussé SANS tag
      # (push-by-digest). Aucune image non scannée ne reçoit donc de tag, et c'est exactement le
      # digest publié, arm64 compris, que Trivy analyse. Si un scan échoue, le digest sans tag reste
      # sur GHCR (inoffensif : deploy.sh ne déploie que par tag, puis par digest).
      - name: Construire et pousser par digest (amd64 + arm64, sans tag)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: frontend
          platforms: linux/amd64,linux/arm64
          build-args: GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Installer Trivy (release officielle, somme SHA-256 vérifiée)
        run: |
          set -euo pipefail
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/$archive"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          mkdir "$RUNNER_TEMP/trivy"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      # Trivy lit les identifiants écrits par docker/login-action (~/.docker/config.json).
      - name: Trivy sur le digest publié (amd64)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: >-
          trivy image
          --platform linux/amd64
          --scanners vuln,secret
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          "${IMAGE}@${DIGEST}"
      - name: Trivy sur le digest publié (arm64)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: >-
          trivy image
          --platform linux/arm64
          --scanners vuln,secret
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --exit-code 1
          "${IMAGE}@${DIGEST}"
      # Les deux scans sont passés : les tags sont posés sur le digest scanné (aucune reconstruction).
      - name: Étiqueter le digest (sha-<7> et main)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          args=()
          while read -r tag; do
            if [ -n "$tag" ]; then args+=(--tag "$tag"); fi
          done <<< "$TAGS"
          docker buildx imagetools create "${args[@]}" "${IMAGE}@${DIGEST}"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}"
          # Garde-fou : chaque tag doit désigner exactement le digest scanné (pas un nouvel index).
          while read -r tag; do
            [ -n "$tag" ] || continue
            tagged="$(docker buildx imagetools inspect "$tag" --format '{{json .Manifest}}' | jq -r '.digest')"
            if [ "$tagged" != "$DIGEST" ]; then
              echo "::error::$tag désigne $tagged au lieu du digest scanné $DIGEST"
              exit 1
            fi
            echo "$tag -> $tagged (digest scanné)"
          done <<< "$TAGS"
      # Traçabilité (cicd.md, section 4) : le digest est la seule référence immuable.
      - name: Résumé (image, tags, digest, scans)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image publiée : ${IMAGE}"
            echo
            echo "- Digest : \`${DIGEST}\`"
            echo "- Commit : \`${GITHUB_SHA}\`"
            echo "- Plateformes : linux/amd64, linux/arm64"
            echo "- Trivy (CRITICAL, HIGH corrigeables, secrets) : amd64 réussi, arm64 réussi (sinon les tags ne seraient pas posés)"
            echo "- Tags :"
            while read -r tag; do echo "  - \`${tag}\`"; done <<< "$TAGS"
            echo
            echo "Référence immuable : \`${IMAGE}@${DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"
