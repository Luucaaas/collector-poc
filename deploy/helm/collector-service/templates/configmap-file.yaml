{{- if .Values.configFile.enabled }}
# Configuration file mounted in the container (e.g. the front end's config.json).
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "collector-service.name" . }}-file
  labels:
    {{- include "collector-service.labels" . | nindent 4 }}
data:
  {{ required "configFile.name is required" .Values.configFile.name }}: |
    {{- required "configFile.content is required" .Values.configFile.content | trim | nindent 4 }}
{{- end }}
