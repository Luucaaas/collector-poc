apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "collector-service.name" . }}
  labels:
    {{- include "collector-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  # With the HPA, the replica count belongs to it: setting it here would reset it on every deployment.
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  # Update without losing capacity: a new pod must be ready before an old one is removed.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      {{- include "collector-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "collector-service.selectorLabels" . | nindent 8 }}
      annotations:
        # A configuration change restarts the pods (the variables are only read at startup).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.configFile.enabled }}
        # Same for the mounted configuration file (e.g. the front end's config.json, read when the page starts).
        checksum/config-file: {{ include (print $.Template.BasePath "/configmap-file.yaml") . | sha256sum }}
        {{- end }}
    spec:
      # No Kubernetes API token in the pod: the service does not call Kubernetes.
      automountServiceAccountToken: false
      # No <SERVICE>_PORT variables injected for each Service in the namespace.
      enableServiceLinks: false
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        fsGroup: {{ .Values.podSecurity.fsGroup }}
      containers:
        - name: app
          image: {{ include "collector-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "collector-service.name" . }}-config
            {{- if .Values.secretName }}
            - secretRef:
                name: {{ .Values.secretName }}
            {{- end }}
          # Probes (paths in probes.*): liveness = the process answers; readiness = ready to serve
          # (services: PostgreSQL reachable, never RabbitMQ; front end: nginx answers on /healthz).
          {{- /* Configurable paths (the nginx front end only has a /healthz probe). */}}
          startupProbe:
            httpGet: {path: {{ .Values.probes.livePath }}, port: http}
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: {{ .Values.probes.livePath }}, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: {{ .Values.probes.readyPath }}, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              # Gives Traefik and the Service time to remove the pod before uvicorn stops.
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- include "collector-service.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- range .Values.extraEmptyDirs }}
            - name: {{ .name }}
              mountPath: {{ .mountPath }}
            {{- end }}
            {{- if .Values.configFile.enabled }}
            - name: config-file
              mountPath: {{ required "configFile.mountPath is required" .Values.configFile.mountPath }}
              subPath: {{ .Values.configFile.name }}
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        {{- range .Values.extraEmptyDirs }}
        - name: {{ .name }}
          emptyDir:
            sizeLimit: {{ .sizeLimit | default "16Mi" }}
        {{- end }}
        {{- if .Values.configFile.enabled }}
        - name: config-file
          configMap:
            name: {{ include "collector-service.name" . }}-file
        {{- end }}
