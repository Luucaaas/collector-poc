{{- if .Values.ingress.enabled }}
{{- if not (has .Values.ingress.mode (list "api" "root")) }}{{ fail (printf "ingress.mode must be api or root (got: %s)" .Values.ingress.mode) }}{{- end }}
{{- $root := eq .Values.ingress.mode "root" }}
{{- if not $root }}
# Removes the prefix (e.g. /catalog) before calling the service (contrats.md §1.1).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "collector-service.name" . }}-strip-prefix
  labels:
    {{- include "collector-service.labels" . | nindent 4 }}
spec:
  stripPrefix:
    prefixes:
      - {{ required "ingress.prefix is required (e.g. /catalog)" .Values.ingress.prefix }}
---
# Security headers of the API responses (audit P9-01, F-07), set once by Traefik rather than in
# each service's code: HSTS, nosniff and Cross-Origin-Resource-Policy. `same-site`: the front end's
# `fetch` calls (https://app.) are CORS requests, which CORP does not block; only direct loading
# (<img>, <script> tag) by another site is refused.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "collector-service.name" . }}-security-headers
  labels:
    {{- include "collector-service.labels" . | nindent 4 }}
spec:
  headers:
    stsSeconds: {{ .Values.ingress.stsSeconds | int64 }}
    contentTypeNosniff: true
    customResponseHeaders:
      Cross-Origin-Resource-Policy: same-site
---
# Only <prefix>/api/v1 is routed: /health/* and /metrics cannot be reached through the ingress.
{{- else }}
# "Root" mode (front end): the whole / path of the host is routed to the Service, without a Middleware.
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "collector-service.name" . }}
  labels:
    {{- include "collector-service.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    {{- if not $root }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-{{ include "collector-service.name" . }}-strip-prefix@kubernetescrd,{{ .Release.Namespace }}-{{ include "collector-service.name" . }}-security-headers@kubernetescrd
    {{- end }}
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          {{- if $root }}
          - path: /
          {{- else }}
          - path: {{ .Values.ingress.prefix }}{{ .Values.ingress.apiPath }}
          {{- end }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "collector-service.name" . }}
                port:
                  name: http
{{- end }}
