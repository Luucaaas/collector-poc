{{- if .Values.migration.enabled }}
# Alembic migration before each install or upgrade (Helm hook): the database is up to date
# before the new pods start. Same image as the service. The successful Job is deleted;
# a failed Job is kept (readable logs) until the next deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "collector-service.name" . }}-migrate
  labels:
    {{- include "collector-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 2
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        # Not the Service's labels: the migration pod must never receive traffic.
        app.kubernetes.io/instance: {{ .Release.Name }}-migrate
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        fsGroup: {{ .Values.podSecurity.fsGroup }}
      containers:
        - name: migrate
          image: {{ include "collector-service.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            {{- toYaml .Values.migration.command | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ required "secretName is required" .Values.secretName }}
                  key: DATABASE_URL
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            {{- include "collector-service.containerSecurityContext" . | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
{{- end }}
