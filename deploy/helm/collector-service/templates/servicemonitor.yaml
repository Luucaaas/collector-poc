{{- if .Values.serviceMonitor.enabled }}
# Asks Prometheus (Prometheus Operator) to scrape /metrics of each pod of the Service. The series'
# `job` label takes the Service name (e.g. job="catalog-service"). The ServiceMonitor CRD is
# installed by kube-prometheus-stack: deploy.sh only enables this option if it exists.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "collector-service.name" . }}
  labels:
    {{- include "collector-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "collector-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval | default "15s" }}
{{- end }}
