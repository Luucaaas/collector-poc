# Default values of the generic chart. Each service completes them in
# deploy/helm/values/<service>.yaml; `deploy.sh services <tag>` provides image.tag and image.digest.

# Name of the objects (Deployment, Service, ...): the release name by default.
nameOverride: ""

image:
  repository: ""        # e.g. ghcr.io/luucaaas/catalog-service
  tag: ""               # e.g. sha-bec38ed (required)
  digest: ""            # sha256:... of the multi-architecture index (required); pins the image (tag@digest)
  pullPolicy: IfNotPresent

# Used only if the HPA is disabled; otherwise the HPA (minReplicas) decides the replica count.
replicaCount: 2
containerPort: 8000

# Secret created by deploy.sh (keys DATABASE_URL and RABBITMQ_URL): never a password here.
# Optional: the nginx front end has no Secret (required only if the migration is enabled).
secretName: ""

# Identity of the container process and owner of the volumes (fsGroup). 10001 for the Python
# images; the front end (nginx-unprivileged) runs as uid 101.
podSecurity:
  uid: 10001
  gid: 10001
  fsGroup: 10001

# HTTP probe paths (on the `http` port). The front end only has /healthz.
probes:
  livePath: /health/live
  readyPath: /health/ready

# Extra emptyDirs (in addition to /tmp), to keep a read-only root file
# system. List of {name, mountPath, sizeLimit}. E.g. front end: nginx template output (/etc/nginx/conf.d).
extraEmptyDirs: []

# Configuration file mounted from a ConfigMap, read-only (subPath). A change to
# `content` restarts the pods (checksum annotation). E.g. front end: config.json.
configFile:
  enabled: false
  name: ""              # file name in the ConfigMap (key)
  mountPath: ""         # full path in the container
  content: ""           # file text

# Non-sensitive variables. The code's default values are the POC's; they are
# explicit here so that the cluster configuration reads in a single place.
config:
  ISSUER: https://auth.127.0.0.1.sslip.io/realms/collector
  JWKS_URL: http://keycloak.collector.svc.cluster.local:8080/realms/collector/protocol/openid-connect/certs
  AUDIENCE: collector-api
  CORS_ORIGIN: https://app.127.0.0.1.sslip.io
  LOG_LEVEL: INFO

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  mode: api             # api: <prefix><apiPath> with a StripPrefix Middleware; root: path / without a Middleware (front end)
  host: api.127.0.0.1.sslip.io
  prefix: ""            # e.g. /catalog: removed by the StripPrefix Middleware before calling the service
  stsSeconds: 31536000  # HSTS (api mode): one year, without includeSubDomains or preload (the sslip.io domain is not ours)
  apiPath: /api/v1      # only this path is routed: /health/* and /metrics stay outside the Ingress

migration:
  enabled: true
  command: ["alembic", "upgrade", "head"]
  activeDeadlineSeconds: 300

terminationGracePeriodSeconds: 30

# ServiceMonitor (Prometheus Operator) on /metrics, `http` port. Disabled by default: the CRD comes
# from kube-prometheus-stack; deploy.sh enables it (--set) when the CRD exists.
serviceMonitor:
  enabled: false
  interval: 15s
