# Valeurs par défaut du chart générique. Chaque service les complète dans
# deploy/helm/values/<service>.yaml ; `deploy.sh services <tag>` fournit image.tag et image.digest.

# Nom des objets (Deployment, Service, ...) : par défaut le nom de la release.
nameOverride: ""

image:
  repository: ""        # ex. ghcr.io/luucaaas/catalog-service
  tag: ""               # ex. sha-bec38ed (obligatoire)
  digest: ""            # sha256:... de l'index multi-architecture (obligatoire) ; épingle l'image (tag@digest)
  pullPolicy: IfNotPresent

# Utilisé seulement si l'HPA est désactivé ; sinon l'HPA (minReplicas) décide du nombre de réplicas.
replicaCount: 2
containerPort: 8000

# Secret créé par deploy.sh (clés DATABASE_URL et RABBITMQ_URL) : jamais de mot de passe ici.
# Facultatif : le front nginx n'a pas de Secret (obligatoire seulement si la migration est activée).
secretName: ""

# Identité du processus du conteneur et propriétaire des volumes (fsGroup). 10001 pour les images
# Python ; le front (nginx-unprivileged) tourne sous l'uid 101.
podSecurity:
  uid: 10001
  gid: 10001
  fsGroup: 10001

# Chemins des sondes HTTP (sur le port `http`). Le front n'a que /healthz.
probes:
  livePath: /health/live
  readyPath: /health/ready

# emptyDir supplémentaires (en plus de /tmp), pour garder un système de fichiers racine en lecture
# seule. Liste de {name, mountPath, sizeLimit}. Ex. front : sortie des modèles nginx (/etc/nginx/conf.d).
extraEmptyDirs: []

# Fichier de configuration monté depuis un ConfigMap, en lecture seule (subPath). Un changement de
# `content` redémarre les pods (annotation de somme de contrôle). Ex. front : config.json.
configFile:
  enabled: false
  name: ""              # nom du fichier dans le ConfigMap (clé)
  mountPath: ""         # chemin complet dans le conteneur
  content: ""           # texte du fichier

# Variables non sensibles. Les valeurs par défaut du code sont celles du POC ; elles sont
# explicites ici pour que la configuration du cluster se lise dans un seul endroit.
config:
  ISSUER: https://auth.127.0.0.1.sslip.io/realms/collector
  JWKS_URL: http://keycloak.collector.svc.cluster.local:8080/realms/collector/protocol/openid-connect/certs
  AUDIENCE: collector-api
  CORS_ORIGIN: https://app.127.0.0.1.sslip.io
  LOG_LEVEL: INFO

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  mode: api             # api : <prefix><apiPath> avec Middleware StripPrefix ; root : chemin / sans Middleware (front)
  host: api.127.0.0.1.sslip.io
  prefix: ""            # ex. /catalog : retiré par le Middleware StripPrefix avant d'appeler le service
  stsSeconds: 31536000  # HSTS (mode api) : un an, sans includeSubDomains ni preload (le domaine sslip.io n'est pas le nôtre)
  apiPath: /api/v1      # seul ce chemin est routé : /health/* et /metrics restent hors de l'Ingress

migration:
  enabled: true
  command: ["alembic", "upgrade", "head"]
  activeDeadlineSeconds: 300

terminationGracePeriodSeconds: 30

# ServiceMonitor (Prometheus Operator) sur /metrics, port `http`. Désactivé par défaut : le CRD vient
# de kube-prometheus-stack ; deploy.sh l'active (--set) quand le CRD existe.
serviceMonitor:
  enabled: false
  interval: 15s
