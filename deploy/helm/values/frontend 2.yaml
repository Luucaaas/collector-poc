# Valeurs propres au front (le reste vient de collector-service/values.yaml) : nginx non root (uid 101),
# port 8080, sans base de données, sans Secret et sans /metrics. Même image partout : la
# configuration d'exécution (config.json et origines de la CSP) vient d'ici.
image:
  repository: ghcr.io/luucaaas/frontend
containerPort: 8080

podSecurity:
  uid: 101
  gid: 101
  fsGroup: 101

probes:
  livePath: /healthz
  readyPath: /healthz

# Rien d'une application FastAPI : on retire les clés par défaut du chart (null supprime la clé).
config:
  ISSUER: null
  JWKS_URL: null
  AUDIENCE: null
  CORS_ORIGIN: null
  LOG_LEVEL: null
  # Origines autorisées par connect-src de la CSP (API et Keycloak), séparées par un espace.
  CSP_CONNECT_SRC: https://api.127.0.0.1.sslip.io https://auth.127.0.0.1.sslip.io

# readOnlyRootFilesystem : nginx écrit dans /tmp (PID, fichiers temporaires) et le modèle envsubst
# produit sa configuration dans /etc/nginx/conf.d.
extraEmptyDirs:
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d

configFile:
  enabled: true
  name: config.json
  mountPath: /usr/share/nginx/html/config.json
  content: |
    {
      "authority": "https://auth.127.0.0.1.sslip.io/realms/collector",
      "clientId": "collector-web",
      "catalogApiUrl": "https://api.127.0.0.1.sslip.io/catalog/api/v1",
      "notificationApiUrl": "https://api.127.0.0.1.sslip.io/notification/api/v1"
    }

ingress:
  mode: root
  host: app.127.0.0.1.sslip.io

# nginx sert des fichiers statiques : mesuré à 1 mC et 8 Mi par pod au repos (kubectl top).
# Requests 25m / 16Mi ; limites 200m / 64Mi (marge de 8 fois la mémoire mesurée).
resources:
  requests:
    cpu: 25m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi

migration:
  enabled: false
