# Values specific to the front end (the rest comes from collector-service/values.yaml): non-root nginx (uid 101),
# port 8080, no database, no Secret and no /metrics. Same image everywhere: the
# runtime configuration (config.json and the CSP origins) comes from here.
image:
  repository: ghcr.io/luucaaas/frontend
containerPort: 8080

podSecurity:
  uid: 101
  gid: 101
  fsGroup: 101

probes:
  livePath: /healthz
  readyPath: /healthz

# Nothing from a FastAPI application: we remove the chart's default keys (null removes the key).
config:
  ISSUER: null
  JWKS_URL: null
  AUDIENCE: null
  CORS_ORIGIN: null
  LOG_LEVEL: null
  # Origins allowed by the CSP connect-src (API and Keycloak), separated by a space.
  CSP_CONNECT_SRC: https://api.127.0.0.1.sslip.io https://auth.127.0.0.1.sslip.io

# readOnlyRootFilesystem: nginx writes to /tmp (PID, temporary files) and the envsubst template
# produces its configuration in /etc/nginx/conf.d.
extraEmptyDirs:
  - name: nginx-conf
    mountPath: /etc/nginx/conf.d

configFile:
  enabled: true
  name: config.json
  mountPath: /usr/share/nginx/html/config.json
  content: |
    {
      "authority": "https://auth.127.0.0.1.sslip.io/realms/collector",
      "clientId": "collector-web",
      "catalogApiUrl": "https://api.127.0.0.1.sslip.io/catalog/api/v1",
      "notificationApiUrl": "https://api.127.0.0.1.sslip.io/notification/api/v1"
    }

ingress:
  mode: root
  host: app.127.0.0.1.sslip.io

# nginx serves static files: measured at 1m CPU and 8 Mi per pod at rest (kubectl top).
# Requests 25m / 16Mi; limits 200m / 64Mi (8 times the measured memory as a margin).
resources:
  requests:
    cpu: 25m
    memory: 16Mi
  limits:
    cpu: 200m
    memory: 64Mi

migration:
  enabled: false
