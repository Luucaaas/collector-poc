# Keycloak: official image, a single-replica Deployment, `keycloak` PostgreSQL database.
# TLS terminated by Traefik: Keycloak listens on HTTP inside the cluster, with the public URL as host
# name (full KC_HOSTNAME: `iss` is always this value) and the X-Forwarded-* headers.
# Secrets created by deploy.sh: postgres-credentials, keycloak-admin (initial administrator) and
# keycloak-realm (realm rendered with the demo passwords, without a test client).
# Internal URL for the services (JWKS keys): http://keycloak.collector.svc.cluster.local:8080
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: collector
  labels: {app: keycloak}
spec:
  selector:
    app: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: collector
  labels: {app: keycloak}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      # Good practice: do not inject into the pod the environment variables of the namespace's
      # Services (<SERVICE>_PORT=tcp://..., <SERVICE>_SERVICE_HOST); DNS resolution is enough.
      enableServiceLinks: false
      securityContext:
        # The Keycloak image runs as the `keycloak` user (uid 1000).
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 0
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.8.0@sha256:27b3230fbabb8c9ff3c66c864cf09dcd8a41aca82e5100679d109ef0eeb05741
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          # No readOnlyRootFilesystem: "start" without --optimized rebuilds Keycloak at every
          # startup. Tried with emptyDir on /tmp and /opt/keycloak/data/tmp: CrashLoopBackOff,
          # "java.nio.file.FileSystemException: /opt/keycloak/lib/quarkus/transformed-bytecode.jar:
          # Read-only file system" (limit L17). A pre-built image would allow it (target).
          args: ["start", "--import-realm"]
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres.collector.svc.cluster.local:5432/keycloak
            - name: KC_DB_USERNAME
              value: keycloak
            - name: KC_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: KEYCLOAK_DB_PASSWORD}
            - name: KC_HOSTNAME
              value: https://auth.127.0.0.1.sslip.io
            # Admin console: its own address, reached through `kubectl port-forward` (the public host
            # no longer routes it, Ingress below). Without it, the console would call the public host
            # for its API (/admin/realms/...) and get a 404.
            - name: KC_HOSTNAME_ADMIN
              value: http://localhost:8080
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              value: admin
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: keycloak-admin, key: password}
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          # HTTP probes on management port 9000. Startup (build then import of the
          # realm) takes several tens of seconds: wide startup probe (7 min).
          startupProbe:
            httpGet: {path: /health/started, port: management}
            periodSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet: {path: /health/ready, port: management}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health/live, port: management}
            periodSeconds: 20
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 700Mi
            limits:
              memory: 1200Mi
      volumes:
        - name: realm
          secret:
            secretName: keycloak-realm
---
# HSTS on Keycloak's public host (audit P9-01, F-07). The other headers are set by Keycloak.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: keycloak-security-headers
  namespace: collector
spec:
  headers:
    stsSeconds: 31536000
---
# The public host only exposes what the browser needs: /realms/ (login, logout, tokens,
# OpenID configuration, keys) and /resources/ (style sheets and scripts of the login page).
# The admin console (/admin) and the master realm can no longer be reached from outside (L19,
# audit P9-01, F-06); the administrator reaches it through `kubectl port-forward` (deploy/README.md).
# The services reach Keycloak through the Service's internal URL (JWKS_URL), without going through this Ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: collector
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: collector-keycloak-security-headers@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.127.0.0.1.sslip.io
  rules:
    - host: auth.127.0.0.1.sslip.io
      http:
        paths:
          - path: /realms/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
          - path: /resources/
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
