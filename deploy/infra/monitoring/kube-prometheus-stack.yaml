# Values of kube-prometheus-stack 91.9.0 for the k3d cluster `collector` (experiment 3, ADR 0008).
# Only the keys that differ from the chart's default values are listed.
# Installed in the `collector` namespace by `deploy/local/deploy.sh monitoring` (release `kps`).
# No secret here: the Grafana password comes from the `grafana-admin` Secret.

# Short, predictable names: services kps-prometheus and kps-grafana.
fullnameOverride: kps

# --- Removed components (the POC only monitors the application) ------------------------------
alertmanager:
  enabled: false            # no alerts in the POC
defaultRules:
  create: false             # the chart's alerting and recording rules: useless without Alertmanager
nodeExporter:
  enabled: false            # machine metrics: not requested
kubeStateMetrics:
  enabled: true             # replicas of the Deployments and of the HPA (load scaling demo, criterion 5)
kubelet:
  enabled: true             # kubelet collection including cAdvisor: CPU and memory per container
kubeApiServer:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false
coreDns:
  enabled: false

# --- Images pinned by tag@sha256 (digest of the multi-architecture index, taken on 05/11/2026
# with `docker buildx imagetools inspect <image>`). The `sha` field only holds the 64 hexadecimal
# characters: the chart adds "@sha256:" (exception: kube-state-metrics, whose subchart
# only adds "@", hence the "sha256:" prefix in its value). To upgrade: change the tag AND the digest.
kube-state-metrics:
  image:
    tag: v2.20.0
    sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 128Mi}

# --- Prometheus Operator ----------------------------------------------------------------
prometheusOperator:
  image:
    tag: v0.94.1
    sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
  prometheusConfigReloader:
    image:
      tag: v0.94.1
      sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b
  tls:
    enabled: false          # without webhooks, no certificate Secret to create (otherwise the pod stays in ContainerCreating)
  admissionWebhooks:
    enabled: false          # avoids the "certgen" Job and one more image
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# --- Prometheus: not exposed (access through `kubectl port-forward svc/kps-prometheus 9090`) ------
prometheus:
  prometheusSpec:
    image:
      tag: v3.15.0-distroless
      sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
    retention: 2h           # no persistent storage (limit L20): 2 h is enough for the demonstrations
    # Selects the ServiceMonitors of all namespaces, without requiring the "release: kps" label.
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {memory: 768Mi}

# --- Grafana: HTTPS through Traefik, no anonymous access ------------------------------------
grafana:
  image:
    tag: 13.2.3-distroless
    sha: 202e5d5b3f8499e70ccac7991eea6d7da72d2790eb2e0597e7987acf724e7180
  defaultDashboardsEnabled: false   # only the dashboards versioned in the repository
  admin:
    existingSecret: grafana-admin   # created by deploy.sh (keys admin-user and admin-password)
    userKey: admin-user
    passwordKey: admin-password
  grafana.ini:
    server:
      domain: grafana.127.0.0.1.sslip.io
      root_url: https://grafana.127.0.0.1.sslip.io
    auth.anonymous:
      enabled: false
    users:
      allow_sign_up: false
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts:
      - grafana.127.0.0.1.sslip.io
    path: /
    tls:
      - hosts:
          - grafana.127.0.0.1.sslip.io   # Traefik's default certificate: the mkcert wildcard
  sidecar:
    image:
      tag: 2.11.2
      sha: 2912be006f62f9ea080194cf6d3afcd90daead8d101d0ba686a137a849f6a4f6
    datasources:
      alertmanager:
        enabled: false          # Alertmanager is disabled: no orphan data source
    dashboards:
      enabled: true
      label: grafana_dashboard      # the sidecar loads any ConfigMap carrying this label
      labelValue: "1"
      searchNamespace: ALL
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
  # 290 to 350 Mi at rest: 384 Mi got Grafana killed (OOMKilled) when opening a dashboard
  # during protocol 5 (P8-03). The request follows the real consumption.
  resources:
    requests: {cpu: 50m, memory: 320Mi}
    limits: {memory: 768Mi}
