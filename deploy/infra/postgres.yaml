# PostgreSQL: official image, a single-replica StatefulSet, k3s local-path volume.
# One instance, three logical databases (catalog_db, notification_db, keycloak) and one role per database.
# The roles are created on the first start of an empty volume by the initialization script
# deploy/compose/postgres-init/10-roles.sh (the same as for the docker compose stack), provided by
# the `postgres-init` ConfigMap that deploy.sh creates. The `postgres-credentials` Secret contains
# POSTGRES_PASSWORD and the three role passwords.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: collector
  labels: {app: postgres}
spec:
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: collector
  labels: {app: postgres}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # Good practice: do not inject into the pod the environment variables of the namespace's
      # Services (<SERVICE>_PORT=tcp://..., <SERVICE>_SERVICE_HOST); DNS resolution is enough.
      enableServiceLinks: false
      securityContext:
        # The alpine image runs PostgreSQL as the `postgres` user (uid/gid 70).
        # fsGroup gives this group to the volume: startup no longer needs to be root.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgres
          image: postgres:18.4-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}
            - name: CATALOG_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: CATALOG_DB_PASSWORD}
            - name: NOTIFICATION_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: NOTIFICATION_DB_PASSWORD}
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: postgres-credentials, key: KEYCLOAK_DB_PASSWORD}
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "postgres"]
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql   # PostgreSQL 18: PGDATA is a versioned subdirectory
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
            # Read-only root file system: only the written paths are mounted.
            - name: run
              mountPath: /var/run/postgresql   # Unix socket and PID file
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: init
          configMap:
            name: postgres-init
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
