# RabbitMQ: official image, a single-replica StatefulSet, k3s local-path volume.
# Users, vhost and permissions come from the definitions file rendered by
# deploy/compose/render.py (`rabbitmq-definitions` Secret), loaded by rabbitmq.conf
# (`rabbitmq-config` ConfigMap): no `guest` user, one user per service.
# The management UI (15672) is only reachable inside the cluster (port-forward): no Ingress.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: collector
  labels: {app: rabbitmq}
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
# Headless Service: gives the pod a stable host name (rabbitmq-0). RabbitMQ stores its data
# in a directory named after its node (rabbit@<host name>): without a stable name, the volume would
# not be picked up again when the pod is recreated (protocol 1).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: collector
  labels: {app: rabbitmq}
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: collector
  labels: {app: rabbitmq}
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # Good practice: do not inject into the pod the environment variables of the namespace's
      # Services (<SERVICE>_PORT=tcp://..., <SERVICE>_SERVICE_HOST). The image reads RABBITMQ_*
      # variables; no reader of RABBITMQ_PORT was found there (grep), so the setting is
      # not essential.
      enableServiceLinks: false
      # Clean shutdown on SIGTERM, measured at a few seconds; 60 s of margin (protocol 1).
      terminationGracePeriodSeconds: 60
      # No pod securityContext or fsGroup: the image's entrypoint starts as root,
      # gives the volume to the `rabbitmq` user then hands over to it. An fsGroup makes the
      # Erlang cookie group-readable and the node then refuses to start (protocol 1 §6,
      # limit L18). Hardening to study in the target.
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          # Ready: the node listens on its ports. Each call starts an Erlang VM, hence
          # timeoutSeconds 10; period of 5 s for a quick return to Ready.
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          # Alive: the node answers an Erlang ping. Wide margin (60 s then 6 failures of 30 s)
          # to never kill a broker that is slow to start.
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-collector.conf
              subPath: rabbitmq.conf
              readOnly: true
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: rabbitmq-definitions.json
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
        - name: definitions
          secret:
            secretName: rabbitmq-definitions
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
