# RabbitMQ : image officielle, un StatefulSet d'un réplica, volume local-path de k3s.
# Utilisateurs, vhost et permissions viennent du fichier de définitions rendu par
# deploy/compose/render.py (Secret `rabbitmq-definitions`), chargé par rabbitmq.conf
# (ConfigMap `rabbitmq-config`) : pas d'utilisateur `guest`, un utilisateur par service.
# Le management (15672) n'est joignable que dans le cluster (port-forward) : aucun Ingress.
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: collector
  labels: {app: rabbitmq}
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
# Service headless : donne au pod un nom d'hôte stable (rabbitmq-0). RabbitMQ range ses données
# dans un dossier nommé d'après son nœud (rabbit@<nom d'hôte>) : sans nom stable, le volume ne
# serait pas repris à la recréation du pod (protocole 1).
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq-headless
  namespace: collector
  labels: {app: rabbitmq}
spec:
  clusterIP: None
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: collector
  labels: {app: rabbitmq}
spec:
  serviceName: rabbitmq-headless
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      # Bonne pratique : ne pas injecter dans le pod les variables d'environnement des Services
      # du namespace (<SERVICE>_PORT=tcp://..., <SERVICE>_SERVICE_HOST). L'image lit des variables
      # RABBITMQ_* ; aucun lecteur de RABBITMQ_PORT n'y a été trouvé (grep), le réglage n'est donc
      # pas indispensable.
      enableServiceLinks: false
      # Arrêt propre sur SIGTERM, mesuré en quelques secondes ; 60 s de marge (protocole 1).
      terminationGracePeriodSeconds: 60
      # Pas de securityContext de pod ni de fsGroup : le point d'entrée de l'image démarre en root,
      # donne le volume à l'utilisateur `rabbitmq` puis lui passe la main. Un fsGroup rend le
      # cookie Erlang lisible par le groupe et le nœud refuse alors de démarrer (protocole 1 §6,
      # limite L18). Durcissement à étudier dans la cible.
      containers:
        - name: rabbitmq
          image: rabbitmq:4.3.5-management@sha256:57bddb6fbc3498b5d8b5a14dc6f4506073ebcf94c66ba2a7678c335faa8dd631
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          # Prêt : le nœud écoute sur ses ports. Chaque appel démarre une VM Erlang, d'où
          # timeoutSeconds 10 ; période de 5 s pour un retour à Ready rapide.
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 10
          # Vivant : le nœud répond à un ping Erlang. Marge large (60 s puis 6 échecs de 30 s)
          # pour ne jamais tuer un broker lent à démarrer.
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
            - name: config
              mountPath: /etc/rabbitmq/conf.d/20-collector.conf
              subPath: rabbitmq.conf
              readOnly: true
            - name: definitions
              mountPath: /etc/rabbitmq/definitions.json
              subPath: rabbitmq-definitions.json
              readOnly: true
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: rabbitmq-config
        - name: definitions
          secret:
            secretName: rabbitmq-definitions
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 1Gi
