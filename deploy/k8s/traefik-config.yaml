# Traefik is provided by k3s. Two settings, taken from experiment 2:
#  - HTTP -> HTTPS redirect (301) at the `web` entry point;
#  - default certificate: the `mkcert-wildcard` Secret (created by cluster.sh from the
#    mkcert certificate), served for all *.127.0.0.1.sslip.io hosts.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
---
apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
  namespace: kube-system
spec:
  defaultCertificate:
    secretName: mkcert-wildcard
