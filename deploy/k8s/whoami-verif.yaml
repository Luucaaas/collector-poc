# Ressource TEMPORAIRE de `cluster.sh verify` : un serveur HTTP minimal pour prouver que
# Traefik sert le certificat et redirige. Supprimée à la fin de la vérification.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami-verif
  namespace: collector
spec:
  replicas: 1
  selector:
    matchLabels: {app: whoami-verif}
  template:
    metadata:
      labels: {app: whoami-verif}
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.11.0@sha256:200689790a0a0ea48ca45992e0450bc26ccab5307375b41c84dfc4f2475937ab
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: whoami-verif
  namespace: collector
spec:
  selector: {app: whoami-verif}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami-verif
  namespace: collector
spec:
  rules:
    - host: whoami.127.0.0.1.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service: {name: whoami-verif, port: {number: 80}}
