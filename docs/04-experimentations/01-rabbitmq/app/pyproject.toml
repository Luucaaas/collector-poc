[project]
name = "exp-rabbitmq"
version = "0.1.0"
description = "Bac à sable de l'expérimentation 1 : RabbitMQ sur k3d"
requires-python = ">=3.12"
dependencies = [
    "aio-pika==10.1.1",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exp"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
