apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  namespace: exp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: exp-rabbitmq-app:local
          imagePullPolicy: Never
          command: ["python", "-m", "exp.consumer"]
          env:
            - name: RABBITMQ_HOST
              value: rabbitmq
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: username
            - name: RABBITMQ_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-default-user
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
