apiVersion: v1
kind: Namespace
metadata:
  name: exp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp-api
  namespace: exp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp-api
  template:
    metadata:
      labels:
        app: exp-api
    spec:
      containers:
        - name: app
          image: exp-keycloak-tls-app:local
          imagePullPolicy: Never
          env:
            # iss attendu : l'URL PUBLIQUE de Keycloak. Clés JWKS : l'URL INTERNE du service.
            - name: ISSUER
              value: https://auth.127.0.0.1.sslip.io/realms/collector
            - name: JWKS_URL
              value: http://keycloak-service.keycloak.svc.cluster.local:8080/realms/collector/protocol/openid-connect/certs
            - name: AUDIENCE
              value: collector-api
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 2
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exp-api
  namespace: exp
spec:
  selector:
    app: exp-api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
# Retire le préfixe /exp avant d'appeler le service (contrats.md §1.1).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-exp
  namespace: exp
spec:
  stripPrefix:
    prefixes:
      - /exp
---
# Seul /exp/api/v1 est routé : /health/* et /metrics du service ne sont pas joignables par l'ingress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: exp-api
  namespace: exp
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.middlewares: exp-strip-exp@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.127.0.0.1.sslip.io
  rules:
    - host: api.127.0.0.1.sslip.io
      http:
        paths:
          - path: /exp/api/v1
            pathType: Prefix
            backend:
              service:
                name: exp-api
                port:
                  number: 8000
