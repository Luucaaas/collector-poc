[project]
name = "exp-observabilite"
version = "0.1.0"
description = "Bac à sable de l'expérimentation 3 : observabilité (kube-prometheus-stack)"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "httpx==0.28.1",
    "prometheus-fastapi-instrumentator==8.1.0",
    "structlog==26.1.0",
    "uvicorn==0.52.4",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/exp"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
