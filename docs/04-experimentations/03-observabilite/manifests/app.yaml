apiVersion: v1
kind: Namespace
metadata:
  name: exp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: exp-app
  namespace: exp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: exp-app
  template:
    metadata:
      labels:
        app: exp-app
    spec:
      containers:
        - name: app
          image: exp-observabilite-app:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 2
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: exp-app
  namespace: exp
  labels:
    app: exp-app
spec:
  selector:
    app: exp-app
  ports:
    - name: http
      port: 8000
      targetPort: http
