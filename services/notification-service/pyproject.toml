[project]
name = "notification-service"
version = "0.1.0"
description = "Service de notifications de Collector.shop : centres d'intérêt, préférences et notifications des acheteurs"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn==0.52.4",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.14.0",
    "structlog==26.1.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "prometheus-fastapi-instrumentator>=7",
    "prometheus-client>=0.26",
    "starlette>=1.10",
    "aio-pika>=10.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "testcontainers[postgres]>=4",
    "cryptography>=43",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["notification"]
concurrency = ["greenlet", "thread"]
