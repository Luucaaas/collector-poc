[project]
name = "collector-acceptance"
version = "0.1.0"
description = "Tests d'acceptation de Collector.shop : 17 critères, de bout en bout sur la pile docker compose"
requires-python = ">=3.12"
# Projet à part : ces tests n'importent aucun code des services, ils parlent à leur API.
package = false
dependencies = [
    "httpx==0.28.1",
    "aio-pika>=10.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
# Format JUnit qui accepte les propriétés enregistrées (délai mesuré de US-05 CA2)
junit_family = "xunit1"
