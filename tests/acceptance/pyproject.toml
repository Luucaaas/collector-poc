[project]
name = "collector-acceptance"
version = "0.1.0"
description = "Collector.shop acceptance tests: 17 criteria, end to end on the docker compose stack"
requires-python = ">=3.12"
# Separate project: these tests import no service code, they talk to the API.
package = false
dependencies = [
    "httpx==0.28.1",
    "aio-pika>=10.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
# JUnit format that accepts recorded properties (delay measured by US-05 CA2)
junit_family = "xunit1"
