[project]
name = "collector-load"
version = "0.1.0"
description = "Collector.shop load test: Locust scenarios on the k3d cluster (indicator I3, ENF-14)"
requires-python = ">=3.12"
# Separate project: no service code is imported, everything goes through the public API.
package = false
dependencies = [
    "locust==2.47.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra"
